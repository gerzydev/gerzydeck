[package]
name = "gerzys-deck"
version = "0.1.0"
edition = "2021"
default-run = "gerzys-deck"

[lib]
name = "gerzys_deck"
path = "src/lib.rs"

[[bin]]
name = "gerzys-deck"
path = "src/main.rs"

[[bin]]
name = "diag"
path = "src/bin/diag.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
imageproc = { version = "0.27", default-features = false }
ab_glyph = "0.2"
sha2 = "0.11"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
base64 = "0.22"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_System_Shutdown",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
